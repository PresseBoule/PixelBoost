<!doctype html>
<html lang="fr">
  <head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Formulaire de devis PixelBoost</title></head>
  <body>
    <form name="demande-devis" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="demande-devis">
      <input name="bot-field">
      <input name="name">
      <input name="company">
      <input type="email" name="email">
      <input name="phone">
      <input name="hasWebsite">
      <input name="website">
      <input name="projectType">
      <input name="budget">
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
